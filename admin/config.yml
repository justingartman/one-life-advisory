          - { name: closingHeading, label: "Closing — Heading", widget: string }
          - { name: closingQuote, label: "Closing Quote (not currently shown)", widget: text, required: false }
          - { name: closingSub, label: "Closing Subtext", widget: text }
          - { name: closingButton, label: "Closing Button", widget: string }
          - name: seo
            label: "Google & Sharing"
            widget: object
            collapsed: true
            required: false
            hint: "How this page appears in Google results and when it's shared. Leave blank to use the page's own heading and subtitle."
            fields:
              - { name: title, label: "Page title", widget: string, required: false, hint: "About 50–60 characters, e.g. 'Retirement Income Planning | One Life Advisory'." }
              - { name: description, label: "Description", widget: text, required: false, hint: "One or two sentences, about 150 characters." }

      # ---- WHAT WE DO ----
      - name: "what-we-do"
        label: "What We Do"
        file: "content/what-we-do.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - { name: clarityLabel, label: "It Starts With Clarity — Eyebrow", widget: string }
          - { name: clarityHeading, label: "It Starts With Clarity — Heading", widget: string }
