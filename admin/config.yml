# ─────────────────────────────────────────────────────────────────────────
# Decap CMS configuration — One Life Advisory
#
# BEFORE THIS WORKS, edit the two placeholders below:
#   1. backend.repo     →  your-github-username/your-repo-name
#   2. backend.base_url →  your live Vercel URL (e.g. https://onelife.vercel.app)
# See CMS-SETUP.md for the full walkthrough (GitHub OAuth app + Vercel env vars).
# ─────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: justingartman/one-life-advisory
  branch: main                  # ← the branch the CMS commits to
  base_url: https://onelifeadvisory.com   # your live custom domain
  auth_endpoint: api/auth       # our Vercel OAuth function (see /api/auth.js)
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" (via CMS)'
    update: 'Update {{collection}} "{{slug}}" (via CMS)'
    delete: 'Delete {{collection}} "{{slug}}" (via CMS)'
    uploadMedia: 'Upload "{{path}}" (via CMS)'
    deleteMedia: 'Delete "{{path}}" (via CMS)'

# Where uploaded images are stored in the repo, and how they're referenced on the site
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Simple publish (commits straight to the branch). Switch to "editorial_workflow"
# later if you want a draft → review → publish flow via Pull Requests.
publish_mode: simple

collections:
  # ───────────────────────── GLOBAL ─────────────────────────
  - name: "global"
    label: "Global — Nav, Footer & Contact"
    description: "Brand-wide settings shown on every page."
    editor: { preview: false }
    files:
      - name: "global"
        label: "Global Settings"
        file: "content/global.json"
        fields:
          - { name: brandLead, label: "Brand Name (dark part)", widget: string, hint: "e.g. 'One Life'" }
          - { name: brandAccent, label: "Brand Name (gold part)", widget: string, hint: "e.g. 'Advisory'" }
          - { name: logoNav, label: "Nav Logo (on white bar)", widget: image, required: false, hint: "Shown in the top bar on interior pages / once you scroll. Use the dark/color version. Leave blank to show the text wordmark." }
          - { name: logoNavDark, label: "Nav Logo (over hero photo)", widget: image, required: false, hint: "The light/reversed version, shown over the homepage photo." }
          - { name: logoFooter, label: "Footer Logo (on navy)", widget: image, required: false, hint: "The reversed/on-dark logo for the footer." }
          - { name: faviconUrl, label: "Favicon", widget: image, required: false, hint: "Browser tab icon (SVG or PNG)." }
          - { name: navCta, label: "Nav Button Label", widget: string }
          - { name: showClientLogin, label: "Show Client Login link", widget: boolean, default: true, hint: "Turn off to hide Client Login everywhere (nav + footer)." }
          - { name: showResources, label: "Show Resources page in menus", widget: boolean, default: false, hint: "Turn off to hide Resources from the menu, mobile menu, and footer while you build it out. The page itself stays intact — preview it any time at yoursite.com/#resources." }
          - { name: clientLoginLabel, label: "Client Login Label", widget: string }
          - { name: clientLoginUrl, label: "Client Login URL", widget: string, required: false }
          - name: nav
            label: "Navigation Labels"
            widget: object
            collapsed: true
            fields:
              - { name: howWePlan, label: "How We Plan", widget: string }
              - { name: whatWeDo, label: "What We Do", widget: string }
              - { name: whoWeHelp, label: "Who We Help", widget: string }
              - { name: about, label: "About", widget: string }
              - { name: resources, label: "Resources", widget: string }
              - { name: faq, label: "FAQ", widget: string }
          - { name: contactEmail, label: "Contact Email", widget: string }
          - { name: contactPhone, label: "Contact Phone", widget: string }
          - { name: throughlineCap, label: "Throughline Label (gold line on home)", widget: string, hint: "The small vertical label beside the gold line on the homepage." }
          - { name: footerTagline, label: "Footer Tagline", widget: string }
          - name: footerCols
            label: "Footer Column Headings"
            widget: object
            collapsed: true
            fields:
              - { name: plan, label: "Column 1 Heading", widget: string }
              - { name: firm, label: "Column 2 Heading", widget: string }
              - { name: connect, label: "Column 3 Heading", widget: string }
          - name: disclosures
            label: "Footer Disclosure Paragraphs"
            widget: list
            field: { name: text, label: "Paragraph", widget: text }
          - { name: copyright, label: "Copyright Line", widget: string }
          - name: legalLinks
            label: "Footer Legal / Disclosure Links"
            widget: list
            hint: "ADV, CRS, Privacy Policy, etc. Paste the URL or link to a PDF you upload via the Media library."
            fields:
              - { name: label, label: "Link Text", widget: string }
              - { name: url, label: "URL", widget: string }

  # ───────────────────────── PAGES ─────────────────────────
  - name: "pages"
    label: "Pages"
    description: "Page-by-page text content."
    editor: { preview: false }
    files:

      # ---- HOME ----
      - name: "home"
        label: "Home Page"
        file: "content/home.json"
        fields:
          - { name: heroImage, label: "Hero Background Image", widget: image, required: false, hint: "Upload a landscape photo for the homepage background. Leave blank to use the built-in gradient." }
          - name: hero
            label: "Hero"
            widget: object
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string }
              - { name: headlineLead, label: "Headline (lead words)", widget: string, hint: "e.g. 'Designed for your'" }
              - { name: headlineAccent, label: "Headline (gold accent words)", widget: string, hint: "e.g. 'one life'" }
              - { name: sub, label: "Subheadline", widget: text }
              - { name: ctaPrimary, label: "Primary Button", widget: string }
              - { name: ctaSecondary, label: "Secondary Button", widget: string }
          - name: fiveQuestions
            label: "Five Questions (The Offer)"
            widget: object
            fields:
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Body (before list)", widget: text }
              - { name: items, label: "The Five Questions", widget: list, field: { name: text, label: Question, widget: string } }
              - { name: body2, label: "Body (after list)", widget: text }
              - { name: note, label: "Italic note", widget: text }
              - { name: linkLabel, label: "Link text", widget: string }
          - name: leadMagnet
            label: "Lead Magnet (free guide)"
            widget: object
            fields:
              - { name: show, label: "Show this section on the site?", widget: boolean, hint: "Keep OFF until the email form is connected — otherwise visitors see a form that goes nowhere." }
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Body", widget: text }
              - { name: emailPlaceholder, label: "Email box placeholder text", widget: string }
              - { name: buttonLabel, label: "Button text", widget: string }
              - { name: privacyNote, label: "Small note under the form", widget: string }
              - { name: formAction, label: "Form action URL (from your email provider)", widget: string, hint: "Paste the form POST URL from Mailchimp/Kit/MailerLite here. Leave as # until connected." }
          - name: whoWeServe
            label: "Who We Serve"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Body", widget: text }
          - name: covers
            label: "What a Plan Covers"
            widget: object
            fields:
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: sub, label: "Subheading", widget: text }
              - { name: button, label: "Button", widget: string }
              - name: cards
                label: "Service Cards"
                widget: list
                fields:
                  - { name: title, label: "Title", widget: string }
                  - { name: desc, label: "Description", widget: text }
          - name: planPreview
            label: "How We Plan (preview)"
            widget: object
            fields:
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Body", widget: text }
              - { name: button, label: "Button", widget: string }
              - name: steps
                label: "Steps"
                widget: list
                fields:
                  - { name: title, label: "Title", widget: string }
                  - { name: desc, label: "Description", widget: text }
          - name: philosophy
            label: "Why We Exist"
            widget: object
            fields:
              - { name: label, label: "Eyebrow", widget: string }
              - { name: quote, label: "Quote", widget: text }
              - { name: body, label: "Body", widget: text }
              - { name: button, label: "Button", widget: string }
          - name: finalCta
            label: "Closing CTA"
            widget: object
            fields:
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: sub, label: "Subheading", widget: text }
              - { name: button, label: "Button", widget: string }

      # ---- HOW WE PLAN ----
      - name: "how-we-plan"
        label: "How We Plan"
        file: "content/how-we-plan.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - name: fiveQ
            label: "The Five Questions"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
              - { name: items, label: "Questions", widget: list, field: { name: text, label: Question, widget: string } }
              - { name: note, label: "Italic note", widget: text }
          - { name: clarityLabel, label: "Clarity Call — Eyebrow", widget: string }
          - { name: clarityHeading, label: "Clarity Call — Heading", widget: string }
          - { name: clarityP1, label: "Clarity Call — Paragraph 1", widget: text }
          - { name: clarityP2, label: "Clarity Call — Paragraph 2", widget: text }
          - { name: clarityButton, label: "Clarity Call — Button", widget: string }
          - { name: groupAHeading, label: "Group A Heading (steps 1–4)", widget: string }
          - name: steps
            label: "Steps (Group A — Getting to the answers)"
            widget: list
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: sub, label: "Subtitle (italic, e.g. 'Video call')", widget: string, required: false }
              - { name: p1, label: "Paragraph 1", widget: text, required: false }
              - { name: p2, label: "Paragraph 2", widget: text, required: false }
          - { name: groupBHeading, label: "Group B Heading (ongoing)", widget: string }
          - { name: groupBIntro, label: "Group B Intro line", widget: text }
          - name: after
            label: "Group B items (Once we're working together)"
            widget: list
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: p1, label: "Paragraph 1", widget: text, required: false }
              - { name: p2, label: "Paragraph 2", widget: text, required: false }
          - name: rhythm
            label: "A Year With Us (annual rhythm)"
            widget: object
            fields:
              - { name: show, label: "Show this section on the site?", widget: boolean, hint: "Turn off to hide the whole section until the copy is ready." }
              - { name: heading, label: "Heading", widget: string }
              - { name: intro, label: "Intro line", widget: text }
              - name: items
                label: "Seasons / touchpoints"
                widget: list
                fields:
                  - { name: title, label: "Title", widget: string }
                  - { name: desc, label: "Description", widget: text }
          - { name: closingQuote, label: "Closing Quote", widget: text }
          - { name: closingSub, label: "Closing Subtext", widget: text }
          - { name: closingButton, label: "Closing Button", widget: string }

      # ---- WHAT WE DO ----
      - name: "what-we-do"
        label: "What We Do"
        file: "content/what-we-do.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - { name: clarityLabel, label: "It Starts With Clarity — Eyebrow", widget: string }
          - { name: clarityHeading, label: "It Starts With Clarity — Heading", widget: string }
          - { name: clarityBody, label: "It Starts With Clarity — Body", widget: text }
          - { name: walkawayLabel, label: "\"What you walk away with\" label", widget: string, hint: "The heading above each accordion's bullet list." }
          - name: acc
            label: "The Six Pieces (accordions)"
            widget: object
            collapsed: true
            fields:
              - { name: liquidity, label: "Liquidity & Cash Flow", widget: object, collapsed: true, fields: [
                  { name: title, label: Title, widget: string },
                  { name: sub, label: Subtitle, widget: string },
                  { name: intro, label: Intro, widget: text },
                  { name: heads, label: Subheadings, widget: list, field: { name: text, label: Subheading, widget: string } },
                  { name: paras, label: Paragraphs, widget: list, field: { name: text, label: Paragraph, widget: text } },
                  { name: walkaway, label: "Walk-away list", widget: list, field: { name: text, label: Item, widget: string } }
                ] }
              - { name: protection, label: "Protection", widget: object, collapsed: true, fields: [
                  { name: title, label: Title, widget: string },
                  { name: sub, label: Subtitle, widget: string },
                  { name: intro, label: Intro, widget: text },
                  { name: heads, label: Subheadings, widget: list, field: { name: text, label: Subheading, widget: string } },
                  { name: paras, label: "Paragraphs (may contain HTML)", widget: list, field: { name: text, label: Paragraph, widget: text } },
                  { name: walkaway, label: "Walk-away list", widget: list, field: { name: text, label: Item, widget: string } },
                  { name: referralDisclosure, label: "Insurance referral disclosure", widget: text, required: false }
                ] }
              - { name: retirement, label: "Retirement Income", widget: object, collapsed: true, fields: [
                  { name: title, label: Title, widget: string },
                  { name: sub, label: Subtitle, widget: string },
                  { name: intro, label: Intro, widget: text },
                  { name: heads, label: Subheadings, widget: list, field: { name: text, label: Subheading, widget: string } },
                  { name: paras, label: "Paragraphs (may contain HTML)", widget: list, field: { name: text, label: Paragraph, widget: text } },
                  { name: walkaway, label: "Walk-away list", widget: list, field: { name: text, label: Item, widget: string } }
                ] }
              - { name: investments, label: "Investments", widget: object, collapsed: true, fields: [
                  { name: title, label: Title, widget: string },
                  { name: sub, label: Subtitle, widget: string },
                  { name: intro, label: Intro, widget: text },
                  { name: heads, label: Subheadings, widget: list, field: { name: text, label: Subheading, widget: string } },
                  { name: paras, label: Paragraphs, widget: list, field: { name: text, label: Paragraph, widget: text } },
                  { name: walkaway, label: "Walk-away list", widget: list, field: { name: text, label: Item, widget: string } }
                ] }
              - { name: tax, label: "Tax-Aware Planning", widget: object, collapsed: true, fields: [
                  { name: title, label: Title, widget: string },
                  { name: sub, label: Subtitle, widget: string },
                  { name: intro, label: Intro, widget: text },
                  { name: heads, label: Subheadings, widget: list, field: { name: text, label: Subheading, widget: string } },
                  { name: paras, label: Paragraphs, widget: list, field: { name: text, label: Paragraph, widget: text } },
                  { name: walkaway, label: "Walk-away list", widget: list, field: { name: text, label: Item, widget: string } }
                ] }
              - { name: legacy, label: "Legacy", widget: object, collapsed: true, fields: [
                  { name: title, label: Title, widget: string },
                  { name: sub, label: Subtitle, widget: string },
                  { name: intro, label: Intro, widget: text },
                  { name: heads, label: Subheadings, widget: list, field: { name: text, label: Subheading, widget: string } },
                  { name: paras, label: "Paragraphs (may contain HTML)", widget: list, field: { name: text, label: Paragraph, widget: text } },
                  { name: walkaway, label: "Walk-away list", widget: list, field: { name: text, label: Item, widget: string } }
                ] }
          - { name: coordinatedLabel, label: "One Plan Coordinated — Eyebrow", widget: string }
          - { name: coordinatedHeading, label: "One Plan Coordinated — Heading", widget: string }
          - { name: coordinatedBody, label: "One Plan Coordinated — Body", widget: text }
          - { name: coordinatedButton, label: "One Plan Coordinated — Button", widget: string }

      # ---- WHO WE HELP ----
      - name: "who-we-help"
        label: "Who We Help"
        file: "content/who-we-help.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - { name: questionsIntro, label: "Five Questions intro (may contain <em> italics)", widget: text, required: false }
          - name: groups
            label: "Client Groups"
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: p1, label: "Paragraph 1", widget: text }
              - { name: p2, label: "Paragraph 2", widget: text }
              - { name: items, label: "Bullet list", widget: list, field: { name: text, label: Item, widget: string } }
          - { name: notFitHeading, label: "Not a Fit — Heading", widget: string }
          - { name: notFitBody, label: "Not a Fit — Paragraph 1", widget: text }
          - { name: notFitBody2, label: "Not a Fit — Paragraph 2", widget: text, required: false }
          - { name: notFitBody3, label: "Not a Fit — Paragraph 3", widget: text, required: false }
          - { name: closingHeading, label: "Closing — Heading", widget: string }
          - { name: closingSub, label: "Closing — Subtext", widget: text }
          - { name: closingButton, label: "Closing — Button", widget: string }

      # ---- ABOUT ----
      - name: "about"
        label: "About"
        file: "content/about.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - { name: whyHeading, label: "Why We Exist — Heading", widget: string }
          - { name: whyP1, label: "Why We Exist — Paragraph 1", widget: text }
          - { name: whyP2, label: "Why We Exist — Paragraph 2", widget: text }
          - { name: believeLabel, label: "What We Believe — Eyebrow", widget: string }
          - { name: believeHeading, label: "What We Believe — Heading", widget: string }
          - name: beliefs
            label: "Beliefs"
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
          - { name: differentLabel, label: "How We're Different — Eyebrow", widget: string }
          - { name: differentHeading, label: "How We're Different — Heading", widget: string }
          - { name: differentP1, label: "How We're Different — Paragraph 1", widget: text }
          - { name: differentP2, label: "How We're Different — Paragraph 2", widget: text }
          - { name: teamLabel, label: "Team — Eyebrow", widget: string }
          - { name: teamHeading, label: "Team — Heading", widget: string }
          - name: team
            label: "Team Members"
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role / Credentials, widget: string }
              - { name: bio, label: Bio, widget: text }
              - { name: photo, label: Photo, widget: image, required: false }
          - { name: closingHeading, label: "Closing — Heading", widget: string }
          - { name: closingSub, label: "Closing — Subtext", widget: text }
          - { name: closingButton, label: "Closing — Button", widget: string }

      # ---- FAQ ----
      - name: "faq"
        label: "FAQ"
        file: "content/faq.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - name: sections
            label: "FAQ Sections"
            widget: list
            fields:
              - { name: title, label: "Section Title", widget: string }
              - name: items
                label: "Questions"
                widget: list
                fields:
                  - { name: q, label: Question, widget: string }
                  - { name: a, label: Answer, widget: text }
          - { name: closingNote, label: "Closing Note", widget: string }
          - { name: closingButton, label: "Closing Button", widget: string }

      # ---- RESOURCES ----
      # Every list below grows to fit: add as many items as you like and the
      # page builds itself. Turn any whole section off with its Show switch.
      - name: "resources"
        label: "Resources"
        file: "content/resources.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - name: featured
            label: "Featured Resource (top callout)"
            widget: object
            fields:
              - { name: show, label: "Show this section?", widget: boolean }
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Body", widget: text }
              - { name: buttonLabel, label: "Button text", widget: string }
              - { name: buttonUrl, label: "Button link", widget: string, hint: "Where the button goes. Upload a PDF below or paste any link." }
          - name: articles
            label: "Articles / Blog"
            widget: object
            fields:
              - { name: show, label: "Show this section?", widget: boolean }
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: intro, label: "Intro line", widget: text, required: false }
              - name: items
                label: "Articles"
                widget: list
                fields:
                  - { name: title, label: "Title", widget: string }
                  - { name: date, label: "Date / status line", widget: string, required: false, hint: "e.g. 'March 2026' or 'Coming soon'." }
                  - { name: summary, label: "Summary", widget: text, required: false }
                  - { name: url, label: "Link", widget: string, required: false, hint: "Full https:// link. Leave blank or # and the card won't be clickable." }
          - name: videos
            label: "Videos"
            widget: object
            fields:
              - { name: show, label: "Show this section?", widget: boolean }
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: intro, label: "Intro line", widget: text, required: false }
              - { name: channelLabel, label: "Channel button text", widget: string, required: false }
              - { name: channelUrl, label: "YouTube channel link", widget: string, required: false, hint: "Button hides itself until you paste a real https:// link." }
              - name: items
                label: "Videos"
                widget: list
                fields:
                  - { name: title, label: "Title", widget: string }
                  - { name: description, label: "Description", widget: text, required: false }
                  - { name: url, label: "YouTube link", widget: string, required: false }
          - name: guides
            label: "Guides & Checklists"
            widget: object
            fields:
              - { name: show, label: "Show this section?", widget: boolean }
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: intro, label: "Intro line", widget: text, required: false }
              - name: items
                label: "Guides"
                widget: list
                fields:
                  - { name: title, label: "Title", widget: string }
                  - { name: description, label: "Description", widget: text, required: false }
                  - { name: buttonLabel, label: "Button text", widget: string, required: false }
                  - { name: url, label: "Link or uploaded file", widget: string, required: false }
          - name: reading
            label: "Recommended Reading"
            widget: object
            fields:
              - { name: show, label: "Show this section?", widget: boolean }
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: intro, label: "Intro line", widget: text, required: false }
              - name: items
                label: "Books"
                widget: list
                fields:
                  - { name: title, label: "Book title", widget: string }
                  - { name: author, label: "Author", widget: string, required: false }
                  - { name: why, label: "Why it's worth reading", widget: text, required: false }
          - name: glossary
            label: "Plain-Language Glossary"
            widget: object
            fields:
              - { name: show, label: "Show this section?", widget: boolean }
              - { name: label, label: "Eyebrow", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: intro, label: "Intro line", widget: text, required: false }
              - name: items
                label: "Terms"
                widget: list
                fields:
                  - { name: term, label: "Term", widget: string }
                  - { name: definition, label: "Plain-language definition", widget: text }
          - { name: closingHeading, label: "Closing — Heading", widget: string }
          - { name: closingSub, label: "Closing — Subtext", widget: text }
          - { name: closingButton, label: "Closing — Button", widget: string }

      # ---- PRIVACY POLICY ----
      # Legal document. When your CCO issues a revision, replace the text here
      # rather than editing it piecemeal, then have them review the live page.
      - name: "privacy"
        label: "Privacy Policy"
        file: "content/privacy.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - { name: contactLine, label: "Address / contact line", widget: string }
          - { name: intro, label: "Opening paragraph", widget: text }
          - name: sections
            label: "Numbered sections"
            widget: list
            fields:
              - { name: title, label: "Section heading", widget: string }
              - { name: paras, label: "Paragraphs (before any bullets)", widget: list, required: false, field: { name: text, label: Paragraph, widget: text } }
              - { name: bullets, label: "Bullet list", widget: list, required: false, field: { name: text, label: Bullet, widget: text } }
              - { name: parasAfter, label: "Paragraphs (after the bullets)", widget: list, required: false, field: { name: text, label: Paragraph, widget: text } }
          - { name: closing, label: "Closing statement (gold callout)", widget: text }
          - { name: registrationNote, label: "Registration note (fine print)", widget: text }

      # ---- SCHEDULE ----
      - name: "schedule"
        label: "Schedule"
        file: "content/schedule.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - { name: calendlyUrl, label: "Scheduling link (Calendly URL)", widget: string, required: false, hint: "Paste your full Calendly link, e.g. https://calendly.com/yourname/clarity-call — leave blank to keep the placeholder." }
          - name: features
            label: "Highlights"
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: desc, label: Description, widget: text }
