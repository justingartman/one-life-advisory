            hint: "How this page appears in Google results and when it's shared. Leave blank to use the page's own heading and subtitle."
            fields:
              - { name: title, label: "Page title", widget: string, required: false, hint: "About 50–60 characters, e.g. 'Retirement Income Planning | One Life Advisory'." }
              - { name: description, label: "Description", widget: text, required: false, hint: "One or two sentences, about 150 characters." }

  # ───────────────────────── BLOG ─────────────────────────
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    description: "A post appears on the site only when its Status is Published. Its address is made from the title the first time you save it (onelifeadvisory.com/blog/your-title); set Web address on the post to choose your own."
    folder: "content/blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}  ·  {{status}}  ·  {{date}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - { label: "Drafts", field: status, pattern: "draft" }
      - { label: "In review", field: status, pattern: "review" }
      - { label: "Published", field: status, pattern: "published" }
    view_groups:
      - { label: "Status", field: status }
    preview_path: "blog/{{slug}}"
    fields:
      - { name: title, label: "Title", widget: string, hint: "Phrase it the way someone would search for it, e.g. 'When should you claim Social Security?'" }
      - name: urlSlug
        label: "Web address"
        widget: string
        required: false
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use lowercase letters, numbers, and dashes only, e.g. retirement-income"]
        hint: "The end of this post's address: onelifeadvisory.com/blog/[this]. Leave blank to use the address made from the title. Short and descriptive works best for Google. If you change it after the post is published, the old address forwards here automatically."
      - name: status
        label: "Status"
        widget: select
        default: "draft"
        options:
          - { label: "Draft", value: "draft" }
          - { label: "In review (compliance)", value: "review" }
          - { label: "Published (live on the site)", value: "published" }
        hint: "Only Published posts appear on the site, in blog search, in Google's sitemap, and in the feed Kit can email from."
      - { name: date, label: "Publish date", widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false, picker_utc: true }
      - { name: updated, label: "Last updated", widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false, picker_utc: true, required: false, default: "", hint: "Set this when you make a meaningful revision. It's shown on the post and to Google." }
      - { name: description, label: "Summary", widget: text, hint: "One or two sentences, about 150 characters. Shown on the blog list, in Google results, and when the post is shared." }
      - name: topics
        label: "Topics"
        widget: relation
        collection: "blog_settings"
        file: "blog"
        search_fields: ["topics.*.name"]
        display_fields: ["topics.*.name"]
        value_field: "topics.*.name"
        multiple: true
        required: false
        hint: "The first topic is the one shown on the post. Add or rename topics under Blog Settings."
      - { name: image, label: "Featured image", widget: image, required: false, hint: "A wide image works best (about 1600 × 900). It's also the picture shown when the post is shared. Without one, the post uses the navy contour design." }
      - { name: imageAlt, label: "Image description", widget: string, required: false, hint: "A few words describing the image, for people using screen readers." }
      - name: body
        label: "Article"
        widget: markdown
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["youtube", "image"]
        hint: "To add a video, click + and choose YouTube video. To link to another post, select the words, click the link button, and paste the post's address, e.g. /blog/will-your-money-last-as-long-as-you-do"
      - name: related
        label: "Related posts"
        widget: relation
        collection: "blog"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "Choose up to 3 posts to suggest at the end of this one. If you leave this empty, posts on the same topic are suggested automatically."
      - name: oldAddresses
        label: "Old addresses to forward here"
        widget: list
        required: false
        collapsed: true
        field: { name: address, label: "Old address", widget: string }
        hint: "Rarely needed. The address made from the title always forwards to this post. If you change the Web address a second time after publishing, add the previous one here (e.g. retirement-income) so links to it keep working."

  - name: "blog_settings"
    label: "Blog Settings"
    description: "The blog page's heading, the list of topics, and a few labels."
    editor: { preview: false }
    files:
      - name: "blog"
        label: "Blog Page & Topics"
        file: "content/blog.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string, hint: "Also used as the 'Blog' link at the top of each post." }
          - { name: heroTitle, label: "Header — Title", widget: string }
          - { name: heroSub, label: "Header — Subtitle", widget: text }
          - name: topics
            label: "Topics"
            widget: list
            summary: "{{fields.name}}"
            hint: "Each topic with at least one Published post gets its own page, e.g. /blog/topics/retirement-income. Renaming a topic here doesn't change posts that already use the old name."
            fields:
              - { name: name, label: "Topic", widget: string }
          - { name: searchPlaceholder, label: "Search box text", widget: string }
          - { name: allTopicsLabel, label: "'All' button label", widget: string }
          - { name: emptyMessage, label: "Message when a search finds nothing", widget: string }
          - { name: readMoreLabel, label: "Link text on each post card", widget: string, required: false }
          - { name: relatedHeading, label: "Heading above suggested posts", widget: string }
          - { name: authorLabel, label: "Author box label", widget: string }
          - { name: authorLinkLabel, label: "Author box link text", widget: string }
          - { name: postDisclosure, label: "Disclosure at the end of each post", widget: text, required: false, hint: "Leave blank to use the second footer disclosure (the educational-purposes statement)." }
