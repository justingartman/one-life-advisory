              - { name: bullets, label: "Bullet list", widget: list, required: false, field: { name: text, label: Bullet, widget: text } }
              - { name: parasAfter, label: "Paragraphs (after the bullets)", widget: list, required: false, field: { name: text, label: Paragraph, widget: text } }
          - { name: closing, label: "Closing statement (gold callout)", widget: text }
          - { name: registrationNote, label: "Registration note (fine print)", widget: text }
          - name: seo
            label: "Google & Sharing"
            widget: object
            collapsed: true
            required: false
            hint: "How this page appears in Google results and when it's shared. Leave blank to use the page's own heading and subtitle."
            fields:
              - { name: title, label: "Page title", widget: string, required: false, hint: "About 50–60 characters, e.g. 'Retirement Income Planning | One Life Advisory'." }
              - { name: description, label: "Description", widget: text, required: false, hint: "One or two sentences, about 150 characters." }

      # ---- SCHEDULE ----
      - name: "schedule"
        label: "Schedule"
        file: "content/schedule.json"
        fields:
          - { name: heroEyebrow, label: "Header — Eyebrow", widget: string }
